services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gio-reminder-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - gio-reminder
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - APP_ENV=local

  nginx:
    image: nginx:alpine
    container_name: gio-reminder-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gio-reminder
    depends_on:
      - app

  postgres:
    image: pgvector/pgvector:pg17
    container_name: gio-reminder-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gio_reminder
      POSTGRES_USER: gio_user
      POSTGRES_PASSWORD: secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gio-reminder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gio_user -d gio_reminder"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gio-reminder-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    networks:
      - gio-reminder
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gio-reminder-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan schedule:work
    networks:
      - gio-reminder
    depends_on:
      postgres:
        condition: service_healthy

networks:
  gio-reminder:
    driver: bridge

volumes:
  postgres_data:
    driver: local
