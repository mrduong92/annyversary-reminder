services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gio-reminder-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - gio-reminder
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - APP_ENV=local

  nginx:
    image: nginx:alpine
    container_name: gio-reminder-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - gio-reminder
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: gio-reminder-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: gio_reminder
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: gio_user
      MYSQL_PASSWORD: secret
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - gio-reminder
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gio-reminder-queue
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    networks:
      - gio-reminder
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: gio-reminder-scheduler
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: php artisan schedule:work
    networks:
      - gio-reminder
    depends_on:
      mysql:
        condition: service_healthy

networks:
  gio-reminder:
    driver: bridge

volumes:
  mysql_data:
    driver: local
