services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anniversary
      POSTGRES_PASSWORD: anniversary123
      POSTGRES_DB: anniversary_reminder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anniversary -d anniversary_reminder"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  pgdata:
